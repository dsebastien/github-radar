name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json

            - run: bun install --frozen-lockfile

            - name: Validate
              run: bun run validate

            - name: Install the Playwright browser
              run: bunx playwright install --with-deps chromium

            - name: Browser smoke test (mocked GitHub API)
              run: bun run test:e2e

            - name: Build
              # Served from the custom domain in public/CNAME, so assets live at the root.
              # Forking without a custom domain? Use BASE_PATH="/${GITHUB_REPOSITORY#*/}/" and drop public/CNAME.
              run: BASE_PATH="/" bun run build

            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
